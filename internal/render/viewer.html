<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>calltrail — Go call graph</title>
<script>(function () { var t = null; try { t = localStorage.getItem('calltrail.theme'); } catch (e) {} if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; })();</script>
<style>
:root{
  --canvas:#020617;--mask:#0F172A;--ink:#fff;--muted:#94A3B8;--dim:#475569;--border:#1E293B;
  --frontend:#22D3EE;--backend:#34D399;--database:#A78BFA;--cloud:#FBBF24;--security:#FB7185;--messagebus:#FB923C;--external:#94A3B8;
  --edge:#64748B;--edge-bound:#475569;--edge-cb:#38bdf8;--grid:#1E293B;--panel-bg:rgba(15,23,42,.6);--gbox:rgba(52,211,153,.04);--gbox-focus:rgba(52,211,153,.08);
  --shadow:rgba(0,0,0,.30);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
/* Same semantic colours, darker so they read on white (Archify's theme-parity rule: the colour keeps its meaning). */
:root[data-theme=light]{
  --canvas:#F8FAFC;--mask:#FFFFFF;--ink:#0F172A;--muted:#475569;--dim:#94A3B8;--border:#E2E8F0;
  --frontend:#0891B2;--backend:#059669;--database:#7C3AED;--cloud:#B45309;--security:#E11D48;--messagebus:#EA580C;--external:#64748B;
  --edge:#94A3B8;--edge-bound:#CBD5E1;--edge-cb:#0284C7;--grid:#E2E8F0;--panel-bg:rgba(255,255,255,.75);--gbox:rgba(5,150,105,.05);--gbox-focus:rgba(5,150,105,.10);
  --shadow:rgba(15,23,42,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font-family:var(--mono);font-size:12px}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--border)}
header h1{margin:0;font-size:14px;font-weight:700;letter-spacing:-.02em}
header .stats{color:var(--muted)}
header .spacer{flex:1}
button,input[type=search]{font:inherit;color:var(--ink);background:var(--mask);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--frontend)}
input[type=search]{width:200px}input[type=search]:focus{outline:none;border-color:var(--frontend);box-shadow:0 0 0 2px rgba(34,211,238,.25)}
label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}
main{position:relative;display:grid;grid-template-columns:1fr 360px;min-height:0}
#stage{position:relative;overflow:hidden;min-width:0;cursor:grab;
  background-image:radial-gradient(circle,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#stage.panning{cursor:grabbing}
svg{width:100%;height:100%;display:block}
aside{border-left:1px solid var(--border);overflow:auto;padding:16px;background:var(--panel-bg)}
aside h2{margin:0 0 4px;font-size:14px;word-break:break-all}
aside .sub{color:var(--muted);margin-bottom:12px;word-break:break-all}
aside h3{margin:16px 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border:1px solid var(--border);border-radius:999px;font-size:10px;margin-right:4px;color:var(--muted)}
.chip.cyan{color:var(--frontend);border-color:var(--frontend)}.chip.green{color:var(--backend);border-color:var(--backend)}
.chip.rose{color:var(--security);border-color:var(--security)}.chip.amber{color:var(--cloud);border-color:var(--cloud)}
.chip.orange{color:var(--messagebus);border-color:var(--messagebus)}.chip.violet{color:var(--database);border-color:var(--database)}
.item{padding:6px 8px;margin:0 -8px;border-radius:6px;cursor:pointer;word-break:break-all}
.item:hover{background:var(--mask)}
.item small{display:block;color:var(--muted);margin-top:2px;cursor:default}
.hint{color:var(--muted);line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:11px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.legend .sw{width:10px;height:10px;border-radius:2px;border:1.5px solid}
.legend .ln{width:22px;height:0;border-top:2px solid var(--muted)}

.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.seg button.on{border-color:var(--frontend);color:var(--frontend);position:relative}
select{font:inherit;color:var(--ink);background:var(--mask);border:1px solid var(--border);border-radius:6px;padding:3px 4px}
body:not(.focusing) .fctl{display:none}body.focusing .octl{display:none}
body.busy #stage{opacity:.55;transition:opacity .15s}
#info{position:absolute;left:14px;top:12px;max-width:70%;color:var(--muted);font-size:11px;line-height:1.7;pointer-events:none}
#info b{color:var(--ink)}#info .warn{color:var(--cloud)}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);text-align:center;line-height:1.9;pointer-events:none}
.node.focus rect.box{stroke-width:2.6;filter:drop-shadow(0 0 8px currentColor)}
.group.focus rect.gbox{stroke-width:2.4;fill:var(--gbox-focus)}
.fbtn{margin:8px 6px 0 0;border-color:var(--frontend);color:var(--frontend)}
.fbtn.ghost{border-color:var(--border);color:var(--muted)}
@media (max-width:1000px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(320px,1fr) 38%}
  aside{border-left:0;border-top:1px solid var(--border)}
}
/* svg */
.node rect.box{fill:var(--mask);stroke-width:1.2;rx:8}
.node text{pointer-events:none}
.node .t1{font-size:12px;font-weight:600;fill:var(--ink)}
.node .t2{font-size:10px;fill:var(--muted)}
.node:hover rect.box{filter:brightness(1.35)}
:root[data-theme=light] .node:hover rect.box{filter:brightness(.93)}
.node.sel rect.box{stroke-width:2.4;filter:drop-shadow(0 0 7px currentColor)}
.node.match rect.box{stroke:var(--cloud)!important;stroke-width:2.4}
.node .tog{fill:var(--canvas);stroke:var(--border);rx:5;cursor:pointer}
.node .tog:hover{stroke:var(--frontend)}
.node .togt{font-size:12px;fill:var(--muted);text-anchor:middle;pointer-events:none}
.group rect.gbox{fill:var(--gbox);stroke:var(--backend);stroke-width:1.2;stroke-dasharray:2 0;rx:12}
.group .gt{font-size:11px;font-weight:700;fill:var(--backend);letter-spacing:.04em}
.group .ghit{fill:transparent;cursor:pointer}
.edge path.vis{fill:none;stroke:var(--edge);stroke-width:1.3}
.edge path.hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.edge.dynamic path.vis{stroke-dasharray:6 4}
.edge.registers path.vis{stroke:var(--messagebus);stroke-dasharray:9 3 2 3}
.edge.boundary path.vis{stroke:var(--edge-bound)}
.edge.callback path.vis{stroke:var(--edge-cb);stroke-dasharray:1.5 4;stroke-linecap:round;opacity:.85}
.edge text{font-size:10px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--canvas);stroke-width:4px;pointer-events:none}
.edge.hi path.vis{stroke:var(--frontend);stroke-width:2}
.edge.hi.registers path.vis{stroke:var(--messagebus);stroke-width:2}
.edge.selE path.vis{stroke:var(--ink);stroke-width:2.4}
.dim{opacity:.14}
.mk-m{fill:var(--edge)}.mk-h{fill:var(--frontend)}.mk-r{fill:var(--messagebus)}.mk-w{fill:var(--ink)}
/* filter / rules panel */
#filterPanel{position:fixed;top:52px;right:16px;width:380px;max-height:calc(100vh - 70px);overflow:auto;background:var(--mask);border:1px solid var(--border);border-radius:12px;padding:14px 16px;z-index:20;box-shadow:0 18px 48px var(--shadow)}
#filterPanel[hidden]{display:none}
#filterPanel h3{margin:14px 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#filterPanel h3:first-child{margin-top:0}
#filterPanel .cnt{margin-left:auto;color:var(--dim);font-size:10px}
#filterPanel .small{font-size:10px;line-height:1.5;margin:0 0 8px 22px}
#filterPanel .rule{display:flex;align-items:center;gap:6px}
#filterPanel .thr input[type=number]{width:64px;font:inherit;color:var(--ink);background:var(--canvas);border:1px solid var(--border);border-radius:6px;padding:3px 6px}
#filterPanel .thr input[type=number]:focus{outline:none;border-color:var(--frontend)}
#filterPanel .rule label{flex:1;min-width:0;word-break:break-all}
#filterPanel button.x{padding:0 6px;border-radius:6px;color:var(--muted)}
#filterPanel .addrule{display:flex;gap:6px;margin-top:8px}
#filterPanel .addrule input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--canvas);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
#filterPanel .addrule input:focus{outline:none;border-color:var(--frontend)}
#filterPanel .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">calltrail</h1>
    <span class="stats" id="stats"></span>
    <span class="spacer"></span>
    <span class="seg"><button id="mOver" data-i18n="overview"></button><button id="mFocus" data-i18n="focus"></button></span>
    <button id="back" class="fctl" style="display:none" data-i18n="back"></button>
    <label class="chk fctl"><span data-i18n="down"></span><select id="selDown"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="99" data-i18n="all"></option></select></label>

    <label class="chk" id="commonLbl"><input type="checkbox" id="hideCommon" checked><span data-i18n="hideCommon"></span></label>
    <button id="filter" data-i18n-title="filterTip" data-i18n="filter"></button>
    <button id="expandAll" class="octl" data-i18n="expandAll"></button>
    <button id="collapseAll" class="octl" data-i18n="collapseAll"></button>
    <button id="fit" data-i18n="fit"></button>
    <button id="theme" data-i18n-title="themeTip"></button>
    <button id="lang" data-i18n-title="langTip"></button>
    <input type="search" id="q" data-i18n-ph="searchPh">
  </header>
  <main>
    <div id="stage"><svg id="svg"><defs>
      <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-m"/></marker>
      <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-h"/></marker>
      <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-r"/></marker>
      <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-w"/></marker>
    </defs><g id="vp"></g></svg>
      <div id="info"></div>
      <div id="empty"><div id="emptyInner"></div></div></div>
    <aside id="panel"></aside>
  </main>
</div>
<div id="filterPanel" hidden></div>

    el.innerHTML = `<h2>${esc(p.id)}</h2><div class="sub">${esc(p.path)}</div><span class="chip green">${fs.length} functions</span><br><button class="fbtn" data-focus-pkg="${esc(p.id)}">${tr('focusThisPkg')}</button><button class="fbtn ghost" data-ignore="${esc(JSON.stringify({package: p.id}))}" title="${esc(tr('ignorePkgTip'))}">${tr('ignoreThisPkg')}</button>
      <h3>${tr('callsInto')}</h3>${lst(outP)}<h3>${tr('calledFrom')}</h3>${lst(inP)}
      <h3>${tr('funcsH')}</h3>${fs.map(f => `<div class="item" data-goto="${esc(f.id)}">${esc(f.label)}<small>${esc(f.pos || tr('pkgInit'))}${f.role ? ' · ' + roleName(f.role) : ''}</small></div>`).join('')}`;
  }
}

/* ───────────── view (pan / zoom) ───────────── */
function applyView() { $('#vp').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
function fit() {
  const r = $('#stage').getBoundingClientRect();
  if (!scene || !scene.nodes.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const v of scene.rect.values()) { x0 = Math.min(x0, v.x); y0 = Math.min(y0, v.y); x1 = Math.max(x1, v.x + v.w); y1 = Math.max(y1, v.y + v.h); }
  const k = Math.min(1, (r.width - 80) / (x1 - x0), (r.height - 80) / (y1 - y0));
  view = {k, x: (r.width - (x1 - x0) * k) / 2 - x0 * k, y: (r.height - (y1 - y0) * k) / 2 - y0 * k};
  // focus mode: if the whole neighbourhood only fits unreadably small, stay legible and centre on the seed
  const seed = S.mode === 'focus' && S.focus && scene.rect.get(seedNodeId() || 'pkg:' + S.focus.id);
  if (seed && k < 0.55) { view.k = 0.55; view.x = r.width / 2 - (seed.x + seed.w / 2) * 0.55; view.y = r.height / 2 - (seed.y + seed.h / 2) * 0.55; }
  applyView();
}
function select(sel, reveal) {
  S.sel = sel;
  render(true);
}
function revealFn(id) {
  const f = fnById.get(id);
  if (f) { S.expanded.add(f.package); return 'f:' + id; }
  return bById.has(id) ? 'b:' + id : null;
}
(() => {
  const stage = $('#stage');
  let drag = null, moved = 0;
  stage.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y}; moved = 0; });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 4) { stage.classList.add('panning'); view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  });
  window.addEventListener('pointerup', () => { drag = null; stage.classList.remove('panning'); });
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k2 = Math.min(3, Math.max(.05, view.k * Math.exp(-e.deltaY * .0015)));
    view.x = mx - (mx - view.x) * (k2 / view.k); view.y = my - (my - view.y) * (k2 / view.k); view.k = k2;
    applyView();
  }, {passive: false});
  stage.addEventListener('click', e => {
    if (moved > 4) return;
    const tog = e.target.closest('[data-toggle]');
    if (tog) {
      if (S.mode === 'focus') return;
      const id = tog.dataset.toggle;
      S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id);
      return render(true);
    }
    const nd = e.target.closest('[data-node]');
    if (nd) return select({type: 'node', id: nd.dataset.node});
    const ed = e.target.closest('[data-edge]');
    if (ed) return select({type: 'edge', id: ed.dataset.edge});
    select(null);
  });
  stage.addEventListener('dblclick', e => {
    const nd = e.target.closest('[data-node]');
    if (!nd) return;
    const id = nd.dataset.node;
    if (id.startsWith('f:')) setFocus({type: 'fn', id: id.slice(2)});
    else if (id.startsWith('pkg:')) setFocus({type: 'pkg', id: id.slice(4)});
    else if (id.startsWith('b:')) setFocus({type: 'b', id: id.slice(2)});
  });
  $('#panel').addEventListener('click', async e => {
    const t = e.target.closest('[data-focus-fn],[data-focus-pkg],[data-focus-b],[data-goto],[data-goto-node],[data-ignore]');
    if (!t) return;
    const d = t.dataset;
    if (d.ignore) return addRule(JSON.parse(d.ignore));
    if (d.focusFn) return setFocus({type: 'fn', id: d.focusFn});
    if (d.focusPkg) return setFocus({type: 'pkg', id: d.focusPkg});
    if (d.focusB) return setFocus({type: 'b', id: d.focusB});
    if (d.goto) {
      const id = d.goto;
      if (S.mode === 'focus') {
        const nid = fnById.has(id) ? 'f:' + id : 'b:' + id;
        if (scene.rect.has(nid)) { S.sel = {type: 'node', id: nid}; await render(true); focusOn(nid); }
        else setFocus({type: fnById.has(id) ? 'fn' : 'b', id});
        return;
      }
      const nid = revealFn(id);
      if (nid) { await render(true); S.sel = {type: 'node', id: nid}; await render(true); focusOn(nid); }
      return;
    }
    if (d.gotoNode) {
      const u = d.gotoNode;
      if (S.mode === 'focus') return setFocus(u.startsWith('pkg:') ? {type: 'pkg', id: u.slice(4)} : {type: 'b', id: u.slice(2)});
      S.sel = {type: 'node', id: u}; await render(true); focusOn(u);
    }
  });
})();
async function setFocus(seed, push = true) {
  if (push && S.focus) S.hist.push(S.focus);
  S.focus = seed; S.mode = 'focus'; S.q = ''; $('#q').value = '';
  S.sel = seed.type === 'pkg' ? null : {type: 'node', id: (seed.type === 'fn' ? 'f:' : 'b:') + seed.id};
  return render();
}
function focusOn(id) {
  const r = scene.rect.get(id); if (!r) return;
  const sr = $('#stage').getBoundingClientRect();
  view.x = sr.width / 2 - (r.x + r.w / 2) * view.k; view.y = sr.height / 2 - (r.y + r.h / 2) * view.k;
  applyView();
}

/* ───────────── toolbar ───────────── */
$('#expandAll').onclick = () => { G.packages.forEach(p => S.expanded.add(p.id)); render(); };
$('#collapseAll').onclick = () => { S.expanded.clear(); render(); };
$('#fit').onclick = fit;
$('#mOver').onclick = () => { S.mode = 'overview'; render(); };
$('#mFocus').onclick = () => { S.mode = 'focus'; render(); };
$('#selDown').onchange = e => { S.down = +e.target.value; render(); };
$('#selUp').onchange = e => { S.up = +e.target.value; render(); };
$('#back').onclick = () => { if (S.hist.length) setFocus(S.hist.pop(), false); };
$('#q').oninput = e => { S.q = e.target.value; if (S.q.trim().length >= 2) S.sel = null; render(true); };
$('#q').onkeydown = e => {
  if (e.key !== 'Enter' || S.mode === 'focus') return;
  const qs = S.q.trim().toLowerCase();
  if (qs.length < 2) return;
  G.functions.forEach(f => { if (f.id.toLowerCase().includes(qs)) S.expanded.add(f.package); });
  render();
};
window.addEventListener('resize', () => fit());

/* ───────────── filter panel: what is hidden, and ignore rules ───────────── */
const fpanel = $('#filterPanel');
function ruleText(r) { return [r.module && tr('rModule') + r.module, r.package && tr('rPackage') + r.package, r.function && tr('rFunction') + r.function, r.tag && tr('rTag') + r.tag].filter(Boolean).join(tr('rAnd')); }
function renderFilter() {
  const cnt = {};   // reason -> [edges, nodes]
  const bump = (reason, i) => { (cnt[reason] = cnt[reason] || [0, 0])[i]++; };
  G.edges.forEach(e => e.hidden && bump(e.hidden_by, 0));
  G.boundaries.forEach(b => b.hidden && bump(b.hidden_by, 1));
  G.functions.forEach(f => f.hidden && bump(f.hidden_by, 1));
  const reasons = (G.policy || []).filter(p => cnt[p.id]).map(p => `<label class="chk"><input type="checkbox" data-reason="${esc(p.id)}" ${S.show.has(p.id) ? 'checked' : ''}>${esc(tr('fShowReason', polTitle(p)))}<span class="cnt">${tr('fCount', cnt[p.id][0], cnt[p.id][1])}</span></label><div class="hint small">${esc(polDesc(p))}</div>`).join('') || `<div class="hint">${tr('fNoHidden')}</div>`;
  const rules = allRules().map(r => `<div class="rule"><label class="chk"><input type="checkbox" data-rule-on="${esc(r.id)}" ${S.ruleOff.has(r.id) ? '' : 'checked'}>${esc(tr('fIgnore', ruleText(r)))}</label>${r.src === 'file' ? `<span class="cnt">${tr('fRuleFile')}</span>` : `<button class="x" data-rule-del="${esc(r.id)}" title="${esc(tr('fDelRule'))}">✕</button>`}</div>`).join('') || `<div class="hint">${tr('fNoRules')}</div>`;
  const entryBox = ENTRIES.length ? `<label class="chk"><input type="checkbox" id="onlyReach" ${S.onlyReach ? 'checked' : ''}>${tr('fOnlyReach')}</label><div class="hint small">${tr('fEntries', ENTRIES.slice(0, 4).map(esc).join(tr('sep')), ENTRIES.length, ENTRIES.length > 4)}</div>` : '';
  const inpB = `<input type="number" id="maxFanB" min="0" value="${S.maxFanB}">`, inpF = `<input type="number" id="maxFanF" min="0" value="${S.maxFanF}">`;
  fpanel.innerHTML = `<h3>${tr('fShow')}</h3>${entryBox}<label class="chk"><input type="checkbox" id="showB" ${S.showB ? 'checked' : ''}>${tr('fExt')}</label>
    <h3>${tr('hiddenByDefault')}</h3>${reasons}
    <h3>${tr('fFan')}</h3>
    <div class="thr"><label>${tr('fFanB', inpB)}</label></div>
    <div class="hint small">${S.maxFanB ? tr('fWouldB', G.boundaries.filter(b => b.fan_in > S.maxFanB).length) : tr('fOff')}</div>
    <div class="thr"><label>${tr('fFanF', inpF)}</label></div>
    <div class="hint small">${S.maxFanF ? tr('fWouldF', G.functions.filter(f => f.fan_in > S.maxFanF).length) : tr('fOff')}</div>
    <div class="hint small">${tr('fFanHelp')}</div>
    <div class="top">${topList()}</div>
    <h3>${tr('fRules')}</h3>${rules}
    <div class="addrule"><select id="ruleKind"><option value="module">${tr('kModule')}</option><option value="package">${tr('kPackage')}</option><option value="function">${tr('kFunction')}</option><option value="tag">${tr('kTag')}</option></select><input id="ruleVal" placeholder="${esc(tr('rulePh'))}"><button id="ruleAdd">${tr('add')}</button></div>
    <div class="row"><button data-preset='{"tag":"internal"}'>${tr('presetInternal')}</button><button data-preset='{"module":"std"}'>${tr('presetStd')}</button></div>
    <div class="row"><button id="ruleExport">${tr('exportRules')}</button><button id="ruleImport">${tr('importRules')}</button><input type="file" id="ruleFile" accept="application/json,.json" hidden></div>
    <div class="hint small" style="margin:10px 0 0">${tr('fMatchHelp')}</div>`;
}
function topList() {
  const bs = G.boundaries.filter(b => !hiddenB.has(b.id)).sort((a, b) => b.fan_in - a.fan_in || (a.path < b.path ? -1 : 1)).slice(0, 8);
  const fs = G.functions.filter(f => !fnHidden(f) && f.fan_in > 1).sort((a, b) => b.fan_in - a.fan_in || (a.id < b.id ? -1 : 1)).slice(0, 8);
  const row = (name, n, rule) => `<div class="rule"><span style="flex:1;min-width:0;word-break:break-all">${esc(name)}</span><span class="cnt" style="margin:0 6px">${n}</span><button class="x" data-ignore="${esc(JSON.stringify(rule))}" title="${esc(tr('ignoreTip'))}">✕</button></div>`;
  const none = `<div class="hint small">${tr('none')}</div>`;
  return `<div class="hint small" style="margin:0 0 4px">${tr('topB')}</div>${bs.map(b => row(b.path, b.fan_in, b.kind === 'third' ? {module: b.module} : {package: b.path})).join('') || none}
    <div class="hint small" style="margin:8px 0 4px">${tr('topF')}</div>${fs.map(f => row(f.label + '  ·  ' + f.package, f.fan_in, {function: f.id})).join('') || none}`;
}
function syncQuick() { $('#hideCommon').checked = !S.show.has('low-signal'); }
function rulesChanged() {
  persist(); recomputeHidden(); syncQuick();
  if (S.sel && S.sel.type === 'node' && nodeHidden(S.sel.id.replace(/^(f|b):/, ''))) S.sel = null;
  if (S.focus && S.focus.type === 'fn' && fnById.has(S.focus.id) && fnHidden(fnById.get(S.focus.id))) S.focus = null;
  renderFilter(); render(true);
}
function addRule(r) {
  const rule = {id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ...r};
  const key = x => JSON.stringify([x.module || '', x.package || '', x.function || '', x.tag || '']);
  if (allRules().some(x => key(x) === key(rule))) { S.ruleOff.delete(allRules().find(x => key(x) === key(rule)).id); return rulesChanged(); }
  S.userRules.push(rule); rulesChanged();
}
fpanel.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'showB') { S.showB = t.checked; persist(); return render(true); }
  if (t.id === 'onlyReach') { S.onlyReach = t.checked; return rulesChanged(); }
  if (t.id === 'maxFanB' || t.id === 'maxFanF') { const v = Math.max(0, parseInt(t.value, 10) || 0); t.id === 'maxFanB' ? S.maxFanB = v : S.maxFanF = v; return rulesChanged(); }
  if (t.dataset.reason) { t.checked ? S.show.add(t.dataset.reason) : S.show.delete(t.dataset.reason); return rulesChanged(); }
  if (t.dataset.ruleOn) { t.checked ? S.ruleOff.delete(t.dataset.ruleOn) : S.ruleOff.add(t.dataset.ruleOn); return rulesChanged(); }
  if (t.id === 'ruleFile' && t.files[0]) {
    t.files[0].text().then(txt => {
      let rs; try { const j = JSON.parse(txt); rs = Array.isArray(j) ? j : j.rules; } catch (err) { return alert(tr('badRules', err.message)); }
      if (!Array.isArray(rs)) return alert(tr('badShape'));
      let n = 0;
      for (const r of rs) { if (r && (r.module || r.package || r.function || r.tag)) { S.userRules.push({id: 'u' + Date.now().toString(36) + (n++), module: r.module, package: r.package, function: r.function, tag: r.tag, note: r.note}); } }
      rulesChanged();
    });
  }
});
fpanel.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.ignore) return addRule(JSON.parse(t.dataset.ignore));
  if (t.dataset.ruleDel) { S.userRules = S.userRules.filter(r => r.id !== t.dataset.ruleDel); S.ruleOff.delete(t.dataset.ruleDel); return rulesChanged(); }
  if (t.dataset.preset) return addRule(JSON.parse(t.dataset.preset));
  if (t.id === 'ruleAdd') {
    const v = $('#ruleVal').value.trim(); if (!v) return;
    return addRule({[$('#ruleKind').value]: v});
  }
  if (t.id === 'ruleExport') {
    const rules = activeRules().map(r => { const o = {}; for (const k of ['module', 'package', 'function', 'tag', 'note']) if (r[k]) o[k] = r[k]; return o; });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({rules}, null, 2) + '\n'], {type: 'application/json'}));
    a.download = 'calltrail.rules.json'; a.click(); URL.revokeObjectURL(a.href);
  }
  if (t.id === 'ruleImport') $('#ruleFile').click();
});
fpanel.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ruleVal') $('#ruleAdd').click(); });
$('#hideCommon').onchange = e => { e.target.checked ? S.show.delete('low-signal') : S.show.add('low-signal'); rulesChanged(); };
$('#filter').onclick = () => { fpanel.hidden = !fpanel.hidden; if (!fpanel.hidden) renderFilter(); };
document.addEventListener('click', e => { if (!fpanel.hidden && !fpanel.contains(e.target) && e.target.id !== 'filter') fpanel.hidden = true; });

/* ───────────── language ───────────── */
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('calltrail.lang', l); } catch (e) {}
  applyStaticI18n(); updateCommonTip(); updateStats();
  setTheme(document.documentElement.dataset.theme, false);   // also redraws, which rebuilds the info line and the side panel
  if (!fpanel.hidden) renderFilter();
}
$('#lang').onclick = () => setLang(LANG === 'zh' ? 'en' : 'zh');

/* ───────────── theme ───────────── */
function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  if (save) { try { localStorage.setItem('calltrail.theme', t); } catch (e) {} }
  $('#theme').textContent = tr(t === 'light' ? 'toDark' : 'toLight');
  if (scene) render(true);    // node colours are resolved from the CSS variables at draw time
}
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true);
matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
  let saved = null; try { saved = localStorage.getItem('calltrail.theme'); } catch (err) {}
  if (!saved) setTheme(e.matches ? 'light' : 'dark', false);   // follow the system until the user chooses
});

/* ───────────── boot ───────────── */
$('#title').textContent = G.meta.module;
recomputeHidden();
syncQuick();
if (ENTRIES.length) { S.focus = {type: 'fn', id: ENTRIES[0]}; S.sel = {type: 'node', id: 'f:' + ENTRIES[0]}; S.down = 99; S.up = 0; }
function updateCommonTip() {
  const common = G.boundaries.filter(b => b.hidden_by === 'low-signal').map(b => b.path);
  $('#commonLbl').title = common.length ? tr('commonTip', common.length, common.slice(0, 14).join(tr('sep')), common.length > 14) : tr('commonNone');
}
applyStaticI18n();
updateCommonTip();
setTheme(document.documentElement.dataset.theme, false);
updateStats();
function updateStats() { $('#stats').textContent = tr('stats', G.packages.length, G.functions.length, G.meta.total_functions, G.edges.length, G.boundaries.length); }
render();
</script>
</body>
</html>
